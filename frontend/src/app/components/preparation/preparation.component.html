
  <div class="preparation-grid" [style.grid-template-columns]="gridColumns">
    @for (preperation of preparations; track preperation.itemName) {
      <div class="item-div">
        <div class="itemName">
          {{ preperation.itemName }}
        </div>

        <div class="preparationView">
        <span class="itemDispatched itemName">
          {{ preperation.dispatchedAmount }}
        </span>

          <span>|</span>

          <span class="itemPreparation itemName">
          {{ preperation.preparationAmount }}
        </span>
        </div>
      </div>
    }
  </div>
