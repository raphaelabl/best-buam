<div *ngIf="connectionStatus; else disconnected">
  🟢 Verbunden
</div>

<ng-template #disconnected>
  🔴 Nicht verbunden
</ng-template>
<div class="container mt-3" *ngIf="buffetName !== ''">
  <!-- Bestellungen als Cards anzeigen -->
  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let order of orders">
      <div (click)="completeOrder(order.id!)" class="card" [ngClass]="{ 'in-progress': order.order.preparationStatus === 0, 'completed': (order.order.preparationStatus === 1 || order.order.preparationStatus === 2) }">
        <div>
          <h4>{{ order.id }} {{order.order.waiter.lastName}} {{order.order.tableNr}}</h4>
        </div>
        <div class="card-body">
          <ul class="list-group">
            <li class="list-group-item item-name" *ngFor="let position of order.order.positions">
              {{ position.amount }}|   {{ position.item!.name }}
              <span *ngIf="position.isSpezial">({{ position.spezialText }})</span>
            </li>
          </ul>
        </div>
        <!--<<div class="card-footer">
          <button class="btn btn-warning" *ngIf="order.order.preparationStatus === 0" (click)="setInProgress(order.id!)">
            In Bearbeitung setzen
          </button>
          <button class="btn btn-danger" *ngIf="order.order.preparationStatus === 1" (click)="completeOrder(order.id!)">
            Auftrag beenden & Rechnung drucken
          </button>
        </div>-->
      </div>
    </div>
  </div>
</div>
